    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to

      // and sender identity (own child frame / direct parent) is checked

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tems:center;justify-content:center;color:rgba(232,236,255,.4);\"><span style=\"position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:sweepSheen 4.5s cubic-bezier(.4,0,.2,1) infinite;\"><\/span><div style=\"position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"><\/rect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\/circle><path d=\"M21 15l-5-5L5 21\"><\/path><\/svg><span style=\"font-family:Heebo,sans-serif;font-size:13px;font-weight:600;\">תצוגה מקדימה בקרוב<\/span><\/div><\/div>\n          <div style=\"padding:24px;\">\n            <div style=\"font-family:Heebo,sans-serif;font-weight:900;font-size:20px;\">חנות תכשיטים: בהקמה<\/div>\n            <p style=\"color:rgba(232,236,255,.65);font-size:15px;line-height:1.6;margin:8px 0 0;\">חנות אונליין לתכשיטים עם עיצוב הניתן להתאמה אישית לפי המותג, ניהול מלאי ומשלוחים, הגדרת מבצעים והנחות, ותהליך רכישה מאובטח מקצה לקצה.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n    <script>\n    (function(){\n      var EXTS = ['png','jpg','jpeg','webp'];\n      var MAX_PER_PROJECT = 12;\n\n      function probeImage(src){\n        return new Promise(function(resolve){\n          var img = new Image();\n          img.onload = function(){ resolve(src); };\n          img.onerror = function(){ resolve(null); };\n          img.src = src;\n        });\n      }\n\n      function probeIndex(projectIndex, imageIndex){\n        var candidates = EXTS.map(function(ext){ return 'project-' + projectIndex + '-' + imageIndex + '.' + ext; });\n        return Promise.all(candidates.map(probeImage)).then(function(results){\n          for (var i = 0; i < results.length; i++) if (results[i]) return results[i];\n          return null;\n        });\n      }\n\n      function collectImages(projectIndex){\n        var found = [];\n        function step(i){\n          if (i >= MAX_PER_PROJECT) return Promise.resolve(found);\n          return probeIndex(projectIndex, i).then(function(src){\n            if (!src) return found;\n            found.push(src);\n            return step(i + 1);\n          });\n        }\n        return step(0);\n      }\n\n      function buildCarousel(urls){\n        var wrap = document.createElement('div');\n        wrap.className = 'proj-carousel';\n        wrap.setAttribute('data-carousel', '');\n        wrap.style.cssText = 'aspect-ratio:4/5;position:relative;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.08),rgba(255,255,255,.02) 70%);';\n\n        urls.forEach(function(src, n){\n          var img = document.createElement('img');\n          img.src = src;\n          img.alt = '';\n          img.setAttribute('data-slide-img', '');\n          img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;padding:18px;opacity:' + (n === 0 ? '1' : '0') + ';transition:opacity .5s ease;cursor:zoom-in;';\n          wrap.appendChild(img);\n        });\n\n        if (urls.length > 1){\n          var prev = document.createElement('button');\n          prev.type = 'button'; prev.className = 'proj-carousel-prev'; prev.setAttribute('aria-label', 'התמונה הקודמת'); prev.textContent = '›';\n          prev.style.cssText = 'position:absolute;top:50%;right:10px;transform:translateY(-50%);width:30px;height:30px;border-radius:999px;border:none;background:rgba(5,8,31,.55);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);z-index:2;direction:ltr;';\n\n          var next = document.createElement('button');\n          next.type = 'button'; next.className = 'proj-carousel-next'; next.setAttribute('aria-label', 'התמונה הבאה'); next.textContent = '‹';\n          next.style.cssText = 'position:absolute;top:50%;left:10px;transform:translateY(-50%);width:30px;height:30px;border-radius:999px;border:none;background:rgba(5,8,31,.55);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);z-index:2;direction:ltr;';\n\n          var dots = document.createElement('div');\n          dots.className = 'proj-carousel-dots';\n          dots.style.cssText = 'position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2;';\n          urls.forEach(function(_, n){\n            var d = document.createElement('button');\n            d.type = 'button'; d.className = 'proj-carousel-dot'; d.setAttribute('data-index', n); d.setAttribute('aria-label', 'עבור לתמונה ' + (n + 1));\n            d.style.cssText = 'width:7px;height:7px;border-radius:999px;border:none;padding:0;cursor:pointer;background:' + (n === 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)') + ';';\n            dots.appendChild(d);\n          });\n\n          wrap.appendChild(prev);\n          wrap.appendChild(next);\n          wrap.appendChild(dots);\n        }\n\n        return wrap;\n      }\n\n      function initCarousel(root){\n        var imgs = root.querySelectorAll('[data-slide-img]');\n        if (imgs.length < 2) return;\n        var dots = root.querySelectorAll('.proj-carousel-dot');\n        var idx = 0, timer;\n        function show(i){\n          idx = (i + imgs.length) % imgs.length;\n          imgs.forEach(function(img, n){ img.style.opacity = n === idx ? '1' : '0'; });\n          dots.forEach(function(d, n){ d.style.background = n === idx ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)'; });\n        }\n        function next(){ show(idx + 1); }\n        function prev(){ show(idx - 1); }\n        function restart(){ clearInterval(timer); timer = setInterval(next, 4000); }\n
